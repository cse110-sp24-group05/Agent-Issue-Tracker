<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>AIT — Activity</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/activity.css">
    <script>
      // Auth guard: redirect to login if no profile is stored.
      (function () {
        try {
          const raw = localStorage.getItem('ait_profile');
          if (!raw || !JSON.parse(raw).id) throw new Error();
        } catch {
          const next = encodeURIComponent(location.pathname + location.search);
          location.replace('login.html?next=' + next);
        }
      })();
    </script>
  </head>
  <body>
    <script src="./js/activity-app.js" type="module"></script>
    <script src="./js/themes.js" type="module"></script>
    <script src="./js/components/navbar.js"></script>
    <my-navbar></my-navbar>

       <!-- ── Page ─────────────────────────────────────────────────── -->
        <main class="activity-page">
          <div class="activity-wrap">
            
            <header>
              <!-- ── Sprint Health Bar ──────────────────────────────────────── -->
              <div class="sprint-bar">
                <!-- <span class="sprint-bar-label">Sprint</span> -->
                <div class="sprint-pills">
                  <!-- Rendered in activity-app.js -->
                </div>
              </div>
            </header>

            <!-- Two-column: feed + token burn -->
            <div class="activity-grid">

              <!-- ── Live Activity Feed ───────────────────────────── -->
              <section class="dash-section">
                <div class="dash-section-head">
                  <h2 class="dash-section-title">
                    <span class="live-dot" aria-hidden="true"></span>
                    Live Activity
                  </h2>
                </div>
                <div class="feed-list" id="feed-list">
                  <!-- Rendered in activity-app.js -->
                </div>
              </section>

              <!-- ── Token Burn ────────────────────────────────────── -->
              <aside class="dash-section" id="token-burn">
                
              </aside>

            </div>

            <!-- ── Recent Completions ──────────────────────────────── -->
            <section class="dash-section dash-completions-section">
              <div class="dash-section-head">
                <h2 class="dash-section-title">Recent Completions</h2>
              </div>
              <div class="completions-grid" id="completions-grid">
                <!-- Rendered by JS -->
              </div>
            </section>

          </div>
        </main>

        
    <main></main>
    <footer></footer>
  </body>
</html>
