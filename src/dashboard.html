<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
  </head>
  <body>
    <script src="./js/dashboard-app.js" type="module"></script>
    <script src="./js/components/navbar.js"></script>
    <script src="./js/components/sidebar.js"></script>
    <my-navbar></my-navbar>
    <my-sidebar></my-sidebar>

       <!-- ── Page ─────────────────────────────────────────────────── -->
        <main class="dashboard-page">
          <div class="dashboard-wrap">
            
            <header>
              <!-- ── Sprint Health Bar ──────────────────────────────────────── -->
              <div class="sprint-bar">
                <span class="sprint-bar-label">Sprint</span>
                <div class="sprint-pills">
                  <!-- Rendered in dashboard-app.js -->
                </div>
              </div>
            </header>

            <!-- Two-column: feed + token burn -->
            <div class="dashboard-grid">

              <!-- ── Live Activity Feed ───────────────────────────── -->
              <section class="dash-section">
                <div class="dash-section-head">
                  <h2 class="dash-section-title">
                    <span class="live-dot" aria-hidden="true"></span>
                    Live Activity
                  </h2>
                </div>
                <div class="feed-list" id="feed-list">
                  <!-- Rendered in dashboard-app.js -->
                </div>
              </section>

              <!-- ── Token Burn ────────────────────────────────────── -->
              <aside class="dash-section" id="token-burn">
                
              </aside>

            </div>

            <!-- ── Recent Completions ──────────────────────────────── -->
            <section class="dash-section dash-completions-section">
              <div class="dash-section-head">
                <h2 class="dash-section-title">Recent Completions</h2>
              </div>
              <div class="completions-grid" id="completions-grid">
                <!-- Rendered by JS -->
              </div>
            </section>

          </div>
        </main>

        
    <main></main>
    <footer></footer>
  </body>
</html>
