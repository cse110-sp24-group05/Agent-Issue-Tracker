<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT — Setup</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-centered">

  <div class="setup-card card">
    <div class="setup-header">
      <span class="nav-logo">A<span>I</span>T</span>
      <p class="text-muted text-sm">Agent Issue Tracker — first-time setup</p>
    </div>

    <form id="setup-form" class="setup-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="ait-name">
          Your name <span class="field-hint">required</span>
        </label>
        <input class="form-input" type="text" id="ait-name"
               placeholder="e.g. Patrick" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="ait-repo">
          GitHub repo <span class="field-hint">required</span>
        </label>
        <input class="form-input" type="text" id="ait-repo"
               placeholder="owner/repo" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="ait-token">
          GitHub token <span class="field-hint">required</span>
        </label>
        <input class="form-input" type="password" id="ait-token"
               placeholder="ghp_…" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="ait-slack">
          Slack webhook URL <span class="field-hint">optional</span>
        </label>
        <input class="form-input" type="text" id="ait-slack"
               placeholder="https://hooks.slack.com/services/…" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="ait-llm">
          LLM API key <span class="field-hint">optional</span>
        </label>
        <input class="form-input" type="password" id="ait-llm"
               placeholder="sk-…" autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary setup-submit">
        Save and continue
      </button>
    </form>
  </div>

  <script type="module">
    import { getSettings, saveSettings } from './js/data.js';

    const s = getSettings();
    if (s.ait_user) location.replace('index.html');

    document.getElementById('setup-form').addEventListener('submit', e => {
      e.preventDefault();
      saveSettings({
        ait_user:  document.getElementById('ait-name').value.trim(),
        ait_repo:  document.getElementById('ait-repo').value.trim(),
        ait_token: document.getElementById('ait-token').value.trim(),
        ait_slack: document.getElementById('ait-slack').value.trim(),
        ait_llm:   document.getElementById('ait-llm').value.trim()
      });
      location.href = 'index.html';
    });
  </script>

</body>
</html>
