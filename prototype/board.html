  <!-- ── Page ─────────────────────────────────────────────────── -->
  <main class="page">
    <div class="container">
      <div class="board">

        <!-- ── To Do ─────────────────────────────────────────── -->
        <div class="board-column">
          <div class="board-col-header">
            <span class="board-col-title">To Do</span>
            <span class="board-col-count" id="count-todo">3</span>
          </div>
          <div class="board-cards" id="col-todo" data-status="open">
            <!-- Populated by data.js on load -->
          </div>
        </div>

        <!-- ── In Progress ───────────────────────────────────── -->
        <div class="board-column">
          <div class="board-col-header">
            <span class="board-col-title">In Progress</span>
            <span class="board-col-count" id="count-progress">1</span>
          </div>
          <div class="board-cards" id="col-progress" data-status="in-progress">
            <!-- Populated by data.js on load -->
          </div>
        </div>

        <!-- ── Done ─────────────────────────────────────────── -->
        <div class="board-column">
          <div class="board-col-header">
            <span class="board-col-title">Done</span>
            <span class="board-col-count" id="count-done">2</span>
          </div>
          <div class="board-cards" id="col-done" data-status="pending-review">
            <!-- Populated by data.js on load -->
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { getIssues, updateIssue, getSettings } from './js/data.js';

    // ── Helpers ────────────────────────────────────────────────
    const esc      = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const priBadge = p => ({'P0':'badge-p0','P1':'badge-p1','P2':'badge-p2','P3':'badge-p3'})[p] || 'badge-p3';

    // ── Column mapping ──────────────────────────────────────────
    const ZONE_ID = { 'open':'col-todo', 'in-progress':'col-progress',
                      'pending-review':'col-done', 'closed':'col-done' };
    const COUNT_ID = { 'col-todo':'count-todo', 'col-progress':'count-progress', 'col-done':'count-done' };

    // ── Drag state ──────────────────────────────────────────────
    let dragging = null;

    // ── Card factory ────────────────────────────────────────────
    function makeCard(issue) {
      const div = document.createElement('div');
      div.className  = 'board-card card';
      div.draggable  = true;
      div.dataset.id       = issue.id;
      div.dataset.priority = issue.priority;
      div.dataset.status   = issue.status;
      div.innerHTML = `
        <div class="board-card-title">${esc(issue.title)}</div>
        <div class="board-card-meta">
          <span class="badge ${priBadge(issue.priority)}">${issue.priority}</span>
          <span class="board-card-assignee${issue.assignee === 'unassigned' ? ' text-muted' : ''}">
            ${esc(issue.assignee)}
          </span>
          <span class="board-card-budget mono">${issue.token_budget.toLocaleString()} tok</span>
        </div>`;

      div.addEventListener('dragstart', e => {
        dragging = div;
        div.classList.add('dragging');
        e.dataTransfer.setData('text/plain', div.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      div.addEventListener('dragend', () => { div.classList.remove('dragging'); dragging = null; });
      div.addEventListener('click',   () => { location.href = 'issue.html?id=' + div.dataset.id; });
      return div;
    }

    // ── Count update ────────────────────────────────────────────
    function updateCounts() {
      Object.entries(COUNT_ID).forEach(([zoneId, countId]) => {
        document.getElementById(countId).textContent =
          document.getElementById(zoneId).querySelectorAll('.board-card').length;
      });
    }

    // ── Drop zone handlers ──────────────────────────────────────
    document.querySelectorAll('.board-cards').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', e => {
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (!dragging || dragging.parentElement === zone) return;

        const newStatus = zone.dataset.status;
        updateIssue(dragging.dataset.id, { status: newStatus, updatedBy: getSettings().ait_user || 'unknown' });
        dragging.dataset.status = newStatus;
        zone.appendChild(dragging);
        updateCounts();
      });
    });

    // ── Render ──────────────────────────────────────────────────
    function renderBoard() {
      ['col-todo', 'col-progress', 'col-done'].forEach(id => { document.getElementById(id).innerHTML = ''; });
      getIssues().forEach(issue => {
        const zoneId = ZONE_ID[issue.status];
        if (zoneId) document.getElementById(zoneId).appendChild(makeCard(issue));
      });
      updateCounts();
    }

    renderBoard();
  </script>
  <script type="module" src="js/demo.js"></script>

</body>
