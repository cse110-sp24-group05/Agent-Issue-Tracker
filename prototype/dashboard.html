<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT — Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/agent-sim.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>

  <!-- ── Nav ──────────────────────────────────────────────────── -->
  <nav class="nav">
    <a class="nav-logo" href="index.html">A<span>I</span>T</a>
    <div class="nav-tabs">
      <a class="nav-tab" href="index.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm8 0A1.5 1.5 0 0 1 10.5 9h3A1.5 1.5 0 0 1 15 10.5v3A1.5 1.5 0 0 1 13.5 15h-3A1.5 1.5 0 0 1 9 13.5z"/>
        </svg>
        Issues
      </a>
      <a class="nav-tab active" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M1 11v4h3v-4zm4-4v8h3V7zm4-4v12h3V3z"/>
        </svg>
        Dashboard
      </a>
    </div>
    <div class="nav-actions">
      <a class="nav-icon-btn" href="settings.html" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </a>
    </div>
  </nav>

  <!-- ── Sprint Health Bar ──────────────────────────────────────── -->
  <div class="sprint-bar">
    <span class="sprint-bar-label">Sprint</span>
    <div class="sprint-pills">
      <button class="pill" data-filter="open">
        <span class="pill-dot"></span>
        <span class="pill-count" id="pc-open">0</span>
        <span class="pill-label">Open</span>
      </button>
      <button class="pill" data-filter="in-progress">
        <span class="pill-dot"></span>
        <span class="pill-count" id="pc-progress">0</span>
        <span class="pill-label">In Progress</span>
      </button>
      <button class="pill" data-filter="pending-review">
        <span class="pill-dot"></span>
        <span class="pill-count" id="pc-review">0</span>
        <span class="pill-label">Pending Review</span>
      </button>
      <button class="pill" data-filter="blocked">
        <span class="pill-dot"></span>
        <span class="pill-count" id="pc-blocked">0</span>
        <span class="pill-label">Blocked</span>
      </button>
      <button class="pill" data-filter="closed">
        <span class="pill-dot"></span>
        <span class="pill-count" id="pc-closed">0</span>
        <span class="pill-label">Closed</span>
      </button>
    </div>
  </div>

  <!-- ── Page ─────────────────────────────────────────────────── -->
  <main class="dashboard-page">
    <div class="dashboard-wrap">

      <!-- Two-column: feed + token burn -->
      <div class="dashboard-grid">

        <!-- ── Live Activity Feed ───────────────────────────── -->
        <section class="dash-section">
          <div class="dash-section-head">
            <h2 class="dash-section-title">
              <span class="live-dot" aria-hidden="true"></span>
              Live Activity
            </h2>
          </div>
          <div class="feed-list" id="feed-list">
            <!-- Rendered by JS -->
          </div>
        </section>

        <!-- ── Token Burn ────────────────────────────────────── -->
        <aside class="dash-section">
          <div class="dash-section-head">
            <h2 class="dash-section-title">Token Burn</h2>
          </div>
          <div class="token-body">

            <div class="token-section">
              <div class="token-section-label">Sprint Budget</div>
              <div class="budget-row">
                <label for="sprint-budget-input">Tokens</label>
                <input class="budget-input" type="number" id="sprint-budget-input"
                       min="0" step="1000" aria-label="Sprint token budget">
              </div>
            </div>

            <div class="token-section">
              <div class="token-section-label">Used This Sprint</div>
              <div class="token-total-num mono" id="token-total">0</div>
              <div class="token-total-sub" id="token-total-sub">of 20,000 budget</div>
              <div class="sprint-track">
                <div class="sprint-fill" id="sprint-fill"></div>
              </div>
              <div class="sprint-pct" id="sprint-pct">0%</div>
            </div>

            <div class="token-section">
              <div class="token-section-label">By Agent</div>
              <div id="agent-breakdown">
                <span class="token-empty">No tokens used yet.</span>
              </div>
            </div>

            <div class="token-section">
              <div class="token-section-label">Top 3 by Cost</div>
              <div id="top-issues">
                <span class="token-empty">No issues with usage.</span>
              </div>
            </div>

          </div>
        </aside>

      </div>

      <!-- ── Recent Completions ──────────────────────────────── -->
      <section>
        <div class="dash-completions-head">
          <h2 class="dash-section-title">Recent Completions</h2>
        </div>
        <div class="completions-grid" id="completions-grid">
          <!-- Rendered by JS -->
        </div>
      </section>

    </div>
  </main>

  <script type="module">
    import { getIssues, getSprintBudget, saveSprintBudget, getSettings } from './js/data.js';
    import { esc, fmtRelTime } from './js/ui.js';

    // Redirect to first-time setup if no user is configured.
    if (!getSettings().ait_user) location.replace('settings.html');

    // ── Helpers ────────────────────────────────────────────────
    const FEED_LIMIT_DEFAULT = 50;
    const STATUS_CHANGE_RE = /^status changed from/i;

    function actionIcon(action) {
      if (/^created/.test(action))              return '🆕';
      if (/^claimed/.test(action))              return '🤖';
      if (/approved and closed/.test(action))   return '✅';
      if (/^submitted for review/.test(action)) return '⏳';
      if (/^blocked/.test(action))              return '🚫';
      if (/^changes requested/.test(action))    return '↩️';
      if (STATUS_CHANGE_RE.test(action))        return '🔁';
      if (/assignee/.test(action))              return '👤';
      if (/priority/.test(action))              return '🏷️';
      if (/reproduced|confirmed/.test(action))  return '🔍';
      return '📝';
    }

    // Extract the destination status from a "status changed from \"X\" to \"Y\"" string.
    function statusToFromAction(action) {
      const m = /to\s+"([^"]+)"/.exec(action);
      return m ? m[1] : '';
    }

    // ── State ──────────────────────────────────────────────────
    let lastSnapshot  = '';
    let feedExpanded  = false;

    // ── Sprint pills ───────────────────────────────────────────
    function renderPills(issues) {
      const c = { open:0, 'in-progress':0, 'pending-review':0, blocked:0, closed:0 };
      issues.forEach(i => { if (i.status in c) c[i.status]++; });
      document.getElementById('pc-open').textContent     = c['open'];
      document.getElementById('pc-progress').textContent = c['in-progress'];
      document.getElementById('pc-review').textContent   = c['pending-review'];
      document.getElementById('pc-blocked').textContent  = c['blocked'];
      document.getElementById('pc-closed').textContent   = c['closed'];
    }

    // ── Activity feed ──────────────────────────────────────────
    /**
     * Build feed entries with consecutive same-issue status changes collapsed into one.
     * Algorithm:
     *   1. Flatten all audit entries from all (filtered) issues.
     *   2. Sort chronologically (oldest first).
     *   3. Walk forward; when a status-change appears immediately after another
     *      status-change for the SAME issue, merge them (count++, latest "to" wins).
     *   4. Sort the resulting groups reverse-chronologically by their latest timestamp.
     */
    function buildFeed(issues) {
      const flat = [];
      issues.forEach(issue => {
        issue.audit_log.forEach(e => flat.push({
          ...e, issueId: issue.id, issueTitle: issue.title
        }));
      });
      flat.sort((a, b) => new Date(a.at) - new Date(b.at));

      const groups = [];
      for (const entry of flat) {
        const isStatusChange = STATUS_CHANGE_RE.test(entry.action);
        const last = groups[groups.length - 1];

        if (isStatusChange && last && last.kind === 'status-group' && last.issueId === entry.issueId) {
          last.count += 1;
          last.toStatus = statusToFromAction(entry.action) || last.toStatus;
          last.at = entry.at;
          last.by = entry.by;
        } else if (isStatusChange) {
          groups.push({
            kind:      'status-group',
            issueId:   entry.issueId,
            issueTitle:entry.issueTitle,
            count:     1,
            toStatus:  statusToFromAction(entry.action),
            at:        entry.at,
            by:        entry.by
          });
        } else {
          groups.push({ kind: 'entry', ...entry });
        }
      }

      return groups.sort((a, b) => new Date(b.at) - new Date(a.at));
    }

    function feedRowHtml(g) {
      if (g.kind === 'status-group') {
        const label = g.count > 1
          ? `status changed (${g.count}×) → <strong>${esc(g.toStatus)}</strong>`
          : `status → <strong>${esc(g.toStatus)}</strong>`;
        return `
          <div class="feed-entry">
            <span class="feed-icon" aria-hidden="true">🔁</span>
            <div class="feed-body">
              <div class="feed-top">
                <a class="feed-issue-id" href="issue.html?id=${esc(g.issueId)}">${esc(g.issueId)}</a>
                <span class="feed-action">${label}</span>
              </div>
              <div class="feed-meta">by <strong>${esc(g.by)}</strong></div>
            </div>
            <span class="feed-time">${fmtRelTime(g.at)}</span>
          </div>`;
      }
      return `
        <div class="feed-entry">
          <span class="feed-icon" aria-hidden="true">${actionIcon(g.action)}</span>
          <div class="feed-body">
            <div class="feed-top">
              <a class="feed-issue-id" href="issue.html?id=${esc(g.issueId)}">${esc(g.issueId)}</a>
              <span class="feed-action">${esc(g.action)}</span>
            </div>
            <div class="feed-meta">by <strong>${esc(g.by)}</strong></div>
          </div>
          <span class="feed-time">${fmtRelTime(g.at)}</span>
        </div>`;
    }

    function renderFeed(issues) {
      const groups = buildFeed(issues);
      const el     = document.getElementById('feed-list');

      if (!groups.length) {
        el.innerHTML = '<div class="feed-empty">No activity for this filter.</div>';
        return;
      }

      const limit   = feedExpanded ? groups.length : FEED_LIMIT_DEFAULT;
      const visible = groups.slice(0, limit);
      const hidden  = groups.length - visible.length;

      const rows = visible.map(feedRowHtml).join('');
      const more = hidden > 0
        ? `<button class="feed-load-more" id="feed-load-more">Load ${hidden} more…</button>`
        : '';

      el.innerHTML = rows + more;

      const btn = document.getElementById('feed-load-more');
      if (btn) btn.addEventListener('click', () => { feedExpanded = true; renderFeed(getIssues()); });
    }

    // ── Token burn ─────────────────────────────────────────────
    function renderTokenBurn(issues) {
      const budget = getSprintBudget();
      const total  = issues.reduce((s, i) => s + (i.tokens_used || 0), 0);
      const pct    = budget > 0 ? Math.min(100, (total / budget) * 100) : 0;

      // Budget input value
      document.getElementById('sprint-budget-input').value = budget;

      // Total used
      document.getElementById('token-total').textContent    = total.toLocaleString();
      document.getElementById('token-total-sub').textContent = `of ${budget.toLocaleString()} budget`;

      // Progress bar
      const fill = document.getElementById('sprint-fill');
      fill.style.width = pct + '%';
      fill.className   = 'sprint-fill' + (pct >= 90 ? ' danger' : pct >= 70 ? ' warn' : '');
      document.getElementById('sprint-pct').textContent = pct.toFixed(1) + '%';

      // By agent — accumulate
      const byAgent = {};
      issues.forEach(i => {
        const who = i.claimed_by || (i.tokens_used > 0 ? i.assignee : null);
        if (!who || !i.tokens_used) return;
        byAgent[who] = (byAgent[who] || 0) + i.tokens_used;
      });
      const entries = Object.entries(byAgent).sort((a, b) => b[1] - a[1]);
      const maxTok  = entries.length ? entries[0][1] : 1;

      const breakdown = document.getElementById('agent-breakdown');
      if (!entries.length) {
        breakdown.innerHTML = '<span class="token-empty">No tokens used yet.</span>';
      } else {
        breakdown.innerHTML = entries.map(([name, tok]) => `
          <div class="agent-row">
            <span class="agent-name" title="${esc(name)}">${esc(name)}</span>
            <div class="agent-track"><div class="agent-fill" data-tok="${tok}" data-max="${maxTok}"></div></div>
            <span class="agent-tokens">${tok.toLocaleString()}</span>
          </div>`).join('');
        // Set widths via JS to avoid inline styles in HTML
        breakdown.querySelectorAll('.agent-fill').forEach(el => {
          el.style.width = (parseInt(el.dataset.tok) / parseInt(el.dataset.max) * 100).toFixed(1) + '%';
        });
      }

      // Top 3 most expensive
      const top3 = [...issues]
        .filter(i => i.tokens_used > 0)
        .sort((a, b) => b.tokens_used - a.tokens_used)
        .slice(0, 3);

      const topEl = document.getElementById('top-issues');
      if (!top3.length) {
        topEl.innerHTML = '<span class="token-empty">No issues with usage.</span>';
      } else {
        topEl.innerHTML = top3.map(i => {
          const truncated = i.title.length > 40 ? i.title.slice(0, 40) + '…' : i.title;
          return `
            <div class="top-issue">
              <a class="top-issue-title" href="issue.html?id=${esc(i.id)}" title="${esc(i.title)}">${esc(truncated)}</a>
              <span class="top-issue-tokens">${i.tokens_used.toLocaleString()}</span>
            </div>`;
        }).join('');
      }
    }

    // ── Recent completions ─────────────────────────────────────
    function renderCompletions(issues) {
      const closed = [...issues]
        .filter(i => i.status === 'closed')
        .sort((a, b) => new Date(b.completed_at || b.updated_at) - new Date(a.completed_at || a.updated_at))
        .slice(0, 5);

      const el = document.getElementById('completions-grid');
      if (!closed.length) {
        el.innerHTML = '<p class="completions-empty">No closed issues yet.</p>';
        return;
      }

      el.innerHTML = closed.map(i => {
        const closedEntry = [...i.audit_log].reverse().find(e => /approved|closed/.test(e.action));
        const closedBy    = closedEntry ? closedEntry.by : '—';
        const preview     = i.result
          ? esc(i.result.slice(0, 100)) + (i.result.length > 100 ? '…' : '')
          : 'No result recorded.';
        return `
          <div class="completion-card card">
            <a class="completion-title" href="issue.html?id=${esc(i.id)}">${esc(i.title)}</a>
            <div class="completion-meta">
              <span>closed by <strong>${esc(closedBy)}</strong></span>
              <span class="completion-tokens">${i.tokens_used.toLocaleString()} tok</span>
            </div>
            <p class="completion-result">${preview}</p>
            <a class="completion-read-more" href="issue.html?id=${esc(i.id)}">Read more →</a>
          </div>`;
      }).join('');
    }

    // ── Render all ─────────────────────────────────────────────
    function renderAll() {
      const issues = getIssues();
      renderPills(issues);
      renderFeed(issues);
      renderTokenBurn(issues);
      renderCompletions(issues);
    }

    // ── Init ───────────────────────────────────────────────────
    renderAll();
    lastSnapshot = JSON.stringify(getIssues());

    // ── Sprint budget input ────────────────────────────────────
    document.getElementById('sprint-budget-input').addEventListener('change', e => {
      saveSprintBudget(parseInt(e.target.value, 10) || 20000);
      renderTokenBurn(getIssues());
    });

    // ── Pill filter ────────────────────────────────────────────
    // Pills navigate to index.html with the corresponding ?status= filter
    // so the issues view is the single place to drill into status-specific lists.
    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const f = pill.dataset.filter;
        location.href = 'index.html?status=' + encodeURIComponent(f);
      });
    });

    // ── Auto-refresh every 3 seconds ───────────────────────────
    setInterval(() => {
      const issues = getIssues();
      const snap   = JSON.stringify(issues);
      if (snap !== lastSnapshot) {
        lastSnapshot = snap;
        renderAll();
      } else {
        renderFeed(issues); // refresh relative timestamps even if data unchanged
      }
    }, 3000);

    // ── Agent sim re-render hook ───────────────────────────────
    document.addEventListener('ait:data-changed', renderAll);
  </script>
  <script type="module" src="js/agent-sim.js"></script>
  <script type="module" src="js/demo.js"></script>

</body>
</html>
