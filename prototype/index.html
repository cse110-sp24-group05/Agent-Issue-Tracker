<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT — Issues</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/list.css">
  <link rel="stylesheet" href="css/agent-sim.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>

  <!-- ── Nav ──────────────────────────────────────────────────── -->
  <nav class="nav">
    <a class="nav-logo" href="index.html">A<span>I</span>T</a>
    <div class="nav-tabs">
      <a class="nav-tab active" href="index.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm8 0A1.5 1.5 0 0 1 10.5 9h3A1.5 1.5 0 0 1 15 10.5v3A1.5 1.5 0 0 1 13.5 15h-3A1.5 1.5 0 0 1 9 13.5z"/>
        </svg>
        Issues
      </a>
      <a class="nav-tab" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M1 11v4h3v-4zm4-4v8h3V7zm4-4v12h3V3z"/>
        </svg>
        Dashboard
      </a>
    </div>
    <div class="nav-actions">
      <a class="nav-icon-btn" href="settings.html" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </a>
    </div>
  </nav>

  <!-- ── Page ─────────────────────────────────────────────────── -->
  <main class="page">
    <div class="container">

      <!-- Summary bar -->
      <div class="summary-bar">
        <button class="stat-card card stat-open" data-filter="open">
          <div class="stat-number" id="sum-open">0</div>
          <div class="stat-label">Open</div>
        </button>
        <button class="stat-card card stat-progress" data-filter="in-progress">
          <div class="stat-number" id="sum-progress">0</div>
          <div class="stat-label">In Progress</div>
        </button>
        <button class="stat-card card stat-review" data-filter="pending-review">
          <div class="stat-number" id="sum-review">0</div>
          <div class="stat-label">Pending Review</div>
        </button>
        <button class="stat-card card stat-blocked" data-filter="blocked">
          <div class="stat-number" id="sum-blocked">0</div>
          <div class="stat-label">Blocked</div>
        </button>
        <button class="stat-card card stat-closed" data-filter="closed">
          <div class="stat-number" id="sum-closed">0</div>
          <div class="stat-label">Closed</div>
        </button>
      </div>

      <!-- Toolbar: filters + view toggle + new issue -->
      <div class="list-toolbar">
        <div class="filter-bar">
          <select class="form-select filter-select" id="filter-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="open">Open</option>
            <option value="in-progress">In Progress</option>
            <option value="pending-review">Pending Review</option>
            <option value="blocked">Blocked</option>
            <option value="closed">Closed</option>
          </select>

          <select class="form-select filter-select" id="filter-priority" aria-label="Filter by priority">
            <option value="">All priorities</option>
            <option value="P0">P0</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
          </select>

          <input class="form-input filter-input" type="text" id="filter-assignee"
                 placeholder="Assignee…" aria-label="Filter by assignee">

          <input class="form-input filter-search" type="text" id="filter-search"
                 placeholder="Search issues…" aria-label="Search issues">
        </div>

        <div class="toolbar-right">
          <div class="view-toggle" role="group" aria-label="View toggle">
            <button class="view-toggle-btn active" id="view-toggle-list" data-view="list" aria-label="List view">
              <span aria-hidden="true">≡</span> List
            </button>
            <button class="view-toggle-btn" id="view-toggle-board" data-view="board" aria-label="Board view">
              <span aria-hidden="true">⊞</span> Board
            </button>
          </div>
          <button class="btn btn-primary" id="btn-new-issue">+ New Issue</button>
        </div>
      </div>

      <!-- ── List view ───────────────────────────────────────── -->
      <div id="list-view" class="view-container">
        <div class="card issue-table-wrapper">
          <table class="issue-table">
            <colgroup>
              <col class="col-pri">
              <col class="col-id">
              <col class="col-title">
              <col class="col-status">
              <col class="col-assign">
              <col class="col-budget">
              <col class="col-date">
            </colgroup>
            <thead>
              <tr>
                <th>Pri</th>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Assignee</th>
                <th class="align-right">Tokens</th>
                <th class="align-right">Updated</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- ── Board view ──────────────────────────────────────── -->
      <div id="board-view" class="view-container hidden">
        <div class="board">
          <div class="board-column">
            <div class="board-col-header">
              <span class="board-col-title">To Do</span>
              <span class="board-col-count" id="count-todo">0</span>
            </div>
            <div class="board-cards" id="col-todo" data-status="open">
              <!-- Populated by JS -->
            </div>
          </div>
          <div class="board-column">
            <div class="board-col-header">
              <span class="board-col-title">In Progress</span>
              <span class="board-col-count" id="count-progress">0</span>
            </div>
            <div class="board-cards" id="col-progress" data-status="in-progress">
              <!-- Populated by JS -->
            </div>
          </div>
          <div class="board-column">
            <div class="board-col-header">
              <span class="board-col-title">Done</span>
              <span class="board-col-count" id="count-done">0</span>
            </div>
            <div class="board-cards" id="col-done" data-status="pending-review">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ── New Issue Modal ───────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modal-new-issue" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">New Issue</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">&#10005;</button>
      </div>

      <!-- Screen: Choice -->
      <div class="modal-body screen" id="screen-choice">
        <p class="choice-intro text-muted text-sm">How would you like to create this issue?</p>
        <div class="choice-grid">
          <button class="choice-card" id="choice-manual">
            <span class="choice-emoji">✍️</span>
            <span class="choice-name">Create Manually</span>
            <span class="choice-hint">Fill in the fields yourself</span>
          </button>
          <button class="choice-card choice-card-ai" id="choice-ai">
            <span class="choice-emoji">✨</span>
            <span class="choice-name">Create with AI</span>
            <span class="choice-hint">Describe it, AI structures it</span>
          </button>
        </div>
      </div>

      <!-- Screen: Manual form -->
      <div class="screen hidden" id="screen-manual">
        <form class="modal-body" id="form-new-manual">
          <div class="form-group">
            <label class="form-label" for="new-title">Title</label>
            <input class="form-input" type="text" id="new-title"
                   placeholder="Short description of the issue" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="new-description">Description</label>
            <textarea class="form-textarea" id="new-description"
                      placeholder="What needs to be done and why?" rows="3"></textarea>
          </div>
          <div class="modal-row">
            <div class="form-group">
              <label class="form-label" for="new-priority">Priority</label>
              <select class="form-select" id="new-priority">
                <option value="P0">P0</option>
                <option value="P1">P1</option>
                <option value="P2" selected>P2</option>
                <option value="P3">P3</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="new-assignee">Assignee</label>
              <input class="form-input" type="text" id="new-assignee"
                     placeholder="e.g. claude-agent">
            </div>
          </div>
          <div class="modal-row">
            <div class="form-group">
              <label class="form-label" for="new-budget">Token Budget</label>
              <input class="form-input" type="number" id="new-budget"
                     placeholder="2000" min="0" max="100000">
            </div>
            <div class="form-group">
              <label class="form-label" for="new-estimate">Time Estimate (min)</label>
              <input class="form-input" type="number" id="new-estimate"
                     placeholder="60" min="0">
            </div>
          </div>
        </form>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" id="manual-cancel">Cancel</button>
          <button class="btn btn-primary" type="submit" form="form-new-manual">Create Issue</button>
        </div>
      </div>

      <!-- Screen: AI Input -->
      <div class="screen hidden" id="screen-ai-input">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ai-desc-input">Describe the issue in plain language</label>
            <textarea class="form-textarea ai-desc-textarea" id="ai-desc-input" rows="5"
                      placeholder="e.g. The login button breaks on mobile Safari, users can't sign in on iPhone"></textarea>
          </div>
          <p class="ai-hint text-muted text-sm">AI will structure this into a proper issue with title, description, and priority.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" id="ai-input-back">← Back</button>
          <button class="btn btn-primary" id="ai-analyze-btn">Analyze →</button>
        </div>
      </div>

      <!-- Screen: AI Loading -->
      <div class="screen hidden" id="screen-ai-loading">
        <div class="modal-body ai-loading-body">
          <div class="ai-spinner" aria-hidden="true"></div>
          <p class="ai-loading-text">Analyzing with Claude...</p>
        </div>
      </div>

      <!-- Screen: AI Preview -->
      <div class="screen hidden" id="screen-ai-preview">
        <div class="modal-body">
          <div class="ai-created-by-badge">✨ AI-assisted</div>
          <div class="form-group">
            <label class="form-label" for="ai-title">Title</label>
            <input class="form-input" type="text" id="ai-title">
          </div>
          <div class="form-group">
            <label class="form-label" for="ai-description">Description</label>
            <textarea class="form-textarea" id="ai-description" rows="5"></textarea>
          </div>
          <div class="modal-row">
            <div class="form-group">
              <label class="form-label" for="ai-priority">Priority</label>
              <select class="form-select" id="ai-priority">
                <option value="P0">P0 — Critical</option>
                <option value="P1">P1 — High</option>
                <option value="P2">P2 — Medium</option>
                <option value="P3">P3 — Low</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ai-budget">Token Budget</label>
              <input class="form-input" type="number" id="ai-budget" min="0">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="ai-back-btn">← Back</button>
          <button class="btn btn-primary" id="ai-confirm-btn">Confirm & Create</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { getIssues, createIssue, updateIssue, getSettings } from './js/data.js';
    import { priBadge, staBadge, staLabel, createdByIcon, fmtRelTime, esc } from './js/ui.js';

    // Redirect to first-time setup if no user is configured.
    if (!getSettings().ait_user) location.replace('settings.html');

    // ── State ──────────────────────────────────────────────────
    const VIEW_KEY = 'ait_view_pref';
    let currentView = localStorage.getItem(VIEW_KEY) === 'board' ? 'board' : 'list';

    // Apply ?status= filter from query string (set by dashboard pill clicks)
    const initStatusFilter = new URLSearchParams(window.location.search).get('status') || '';

    // ── Summary ────────────────────────────────────────────────
    function updateSummary() {
      const all = getIssues();
      const c = { open: 0, 'in-progress': 0, 'pending-review': 0, blocked: 0, closed: 0 };
      all.forEach(i => { if (i.status in c) c[i.status]++; });
      document.getElementById('sum-open').textContent     = c['open'];
      document.getElementById('sum-progress').textContent = c['in-progress'];
      document.getElementById('sum-review').textContent   = c['pending-review'];
      document.getElementById('sum-blocked').textContent  = c['blocked'];
      document.getElementById('sum-closed').textContent   = c['closed'];

      // Highlight active pill matching filter-status
      const cur = document.getElementById('filter-status').value;
      document.querySelectorAll('.summary-bar .stat-card').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === cur);
      });
    }

    // ── List render ────────────────────────────────────────────
    function renderList(issues) {
      const tbody = document.querySelector('.issue-table tbody');
      if (!issues.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-row">No issues match the current filters.</td></tr>';
        return;
      }
      tbody.innerHTML = issues.map(i => `
        <tr data-issue-row data-id="${esc(i.id)}"
            data-status="${i.status}" data-priority="${i.priority}"
            data-assignee="${esc(i.assignee)}">
          <td><span class="badge ${priBadge(i.priority)}">${i.priority}</span></td>
          <td><a class="issue-id mono" href="issue.html?id=${esc(i.id)}">${esc(i.id)}</a></td>
          <td>
            <span class="created-by-icon" title="created by ${esc(i.created_by || 'unknown')}">${createdByIcon(i.created_by)}</span>
            <a class="issue-title-link" href="issue.html?id=${esc(i.id)}">${esc(i.title)}</a>
          </td>
          <td><span class="badge ${staBadge(i.status)}">${staLabel(i.status)}</span></td>
          <td class="${i.assignee === 'unassigned' ? 'text-muted' : ''}">${esc(i.assignee)}</td>
          <td class="align-right mono text-muted">${i.tokens_used.toLocaleString()} / ${i.token_budget.toLocaleString()}</td>
          <td class="align-right text-muted">${fmtRelTime(i.updated_at)}</td>
        </tr>`).join('');

      tbody.querySelectorAll('[data-issue-row]').forEach(row => {
        row.addEventListener('click', e => {
          if (e.target.closest('a')) return; // let inner links handle their own nav
          location.href = 'issue.html?id=' + row.dataset.id;
        });
      });
    }

    // ── Board render ───────────────────────────────────────────
    const ZONE_ID = {
      'open': 'col-todo', 'in-progress': 'col-progress',
      'pending-review': 'col-done', 'closed': 'col-done',
      'blocked': null
    };
    const COUNT_ID = { 'col-todo': 'count-todo', 'col-progress': 'count-progress', 'col-done': 'count-done' };

    let dragging = null;

    function makeCard(issue) {
      const div = document.createElement('div');
      div.className = 'board-card card';
      if (issue.status === 'blocked') div.classList.add('board-card-blocked');
      div.draggable = true;
      div.dataset.id = issue.id;
      div.dataset.priority = issue.priority;
      div.dataset.status = issue.status;
      div.innerHTML = `
        <div class="board-card-title">
          <span class="created-by-icon" title="created by ${esc(issue.created_by || 'unknown')}">${createdByIcon(issue.created_by)}</span>
          ${esc(issue.title)}
        </div>
        <div class="board-card-meta">
          <span class="badge ${priBadge(issue.priority)}">${issue.priority}</span>
          <span class="board-card-assignee${issue.assignee === 'unassigned' ? ' text-muted' : ''}">
            ${esc(issue.assignee)}
          </span>
          <span class="board-card-budget mono">${issue.token_budget.toLocaleString()} tok</span>
        </div>`;

      div.addEventListener('dragstart', e => {
        dragging = div;
        div.classList.add('dragging');
        e.dataTransfer.setData('text/plain', div.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      div.addEventListener('dragend', () => { div.classList.remove('dragging'); dragging = null; });
      div.addEventListener('click', () => { location.href = 'issue.html?id=' + div.dataset.id; });
      return div;
    }

    function updateBoardCounts() {
      Object.entries(COUNT_ID).forEach(([zoneId, countId]) => {
        const el = document.getElementById(countId);
        if (el) el.textContent = document.getElementById(zoneId).querySelectorAll('.board-card').length;
      });
    }

    function renderBoard(issues) {
      ['col-todo', 'col-progress', 'col-done'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      // Blocked issues show in their pre-blocked column visually — but they have status=blocked.
      // Per spec: blocked stays in its current column with red left border. Since we don't track
      // a previous status, route blocked issues into "To Do".
      issues.forEach(issue => {
        let zoneId = ZONE_ID[issue.status];
        if (zoneId === null) zoneId = 'col-todo';
        if (zoneId) document.getElementById(zoneId).appendChild(makeCard(issue));
      });
      updateBoardCounts();
    }

    document.querySelectorAll('.board-cards').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', e => {
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (!dragging || dragging.parentElement === zone) return;
        const newStatus = zone.dataset.status;
        updateIssue(dragging.dataset.id, { status: newStatus, updatedBy: getSettings().ait_user || 'unknown' });
        dragging.dataset.status = newStatus;
        zone.appendChild(dragging);
        updateBoardCounts();
        applyFilters();
      });
    });

    // ── Filtering / rendering pipeline ─────────────────────────
    function getFiltered() {
      const status   = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const assignee = document.getElementById('filter-assignee').value.trim().toLowerCase();
      const search   = document.getElementById('filter-search').value.toLowerCase();
      return getIssues().filter(i =>
        (!status   || i.status   === status)   &&
        (!priority || i.priority === priority) &&
        (!assignee || (i.assignee || '').toLowerCase().includes(assignee)) &&
        (!search   || i.title.toLowerCase().includes(search))
      );
    }

    function applyFilters() {
      const filtered = getFiltered();
      renderList(filtered);
      renderBoard(filtered);
      updateSummary();
    }

    // ── View toggle ────────────────────────────────────────────
    function setView(view) {
      currentView = view === 'board' ? 'board' : 'list';
      localStorage.setItem(VIEW_KEY, currentView);
      document.getElementById('list-view').classList.toggle('hidden', currentView !== 'list');
      document.getElementById('board-view').classList.toggle('hidden', currentView !== 'board');
      document.getElementById('view-toggle-list').classList.toggle('active', currentView === 'list');
      document.getElementById('view-toggle-board').classList.toggle('active', currentView === 'board');
    }

    document.getElementById('view-toggle-list').addEventListener('click', () => setView('list'));
    document.getElementById('view-toggle-board').addEventListener('click', () => setView('board'));

    // ── Summary pill click → filter status ────────────────────
    document.querySelectorAll('.summary-bar .stat-card').forEach(card => {
      card.addEventListener('click', () => {
        const f = card.dataset.filter;
        const cur = document.getElementById('filter-status').value;
        document.getElementById('filter-status').value = cur === f ? '' : f;
        applyFilters();
      });
    });

    // ── Init ───────────────────────────────────────────────────
    if (initStatusFilter) {
      document.getElementById('filter-status').value = initStatusFilter;
    }
    setView(currentView);
    applyFilters();

    // ── Modal ──────────────────────────────────────────────────
    const overlay = document.getElementById('modal-new-issue');
    const SCREENS = ['choice', 'manual', 'ai-input', 'ai-loading', 'ai-preview'];
    const TITLES  = {
      'choice':     'New Issue',
      'manual':     'New Issue',
      'ai-input':   '✨ Create with AI',
      'ai-loading': '✨ Create with AI',
      'ai-preview': '✨ AI Review'
    };

    function showScreen(name) {
      SCREENS.forEach(s => {
        const el = document.getElementById('screen-' + s);
        if (el) el.classList.toggle('hidden', s !== name);
      });
      document.getElementById('modal-title').textContent = TITLES[name] || 'New Issue';
    }

    function openModal() { overlay.classList.remove('hidden'); showScreen('choice'); }
    function closeModal() {
      overlay.classList.add('hidden');
      showScreen('choice');
      document.getElementById('form-new-manual').reset();
      document.getElementById('ai-desc-input').value = '';
    }

    document.getElementById('btn-new-issue').addEventListener('click', openModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
    });

    document.getElementById('choice-manual').addEventListener('click', () => {
      showScreen('manual');
      document.getElementById('new-title').focus();
    });
    document.getElementById('choice-ai').addEventListener('click', () => {
      showScreen('ai-input');
      document.getElementById('ai-desc-input').focus();
    });

    document.getElementById('manual-cancel').addEventListener('click', closeModal);
    document.getElementById('form-new-manual').addEventListener('submit', e => {
      e.preventDefault();
      createIssue({
        title:         document.getElementById('new-title').value.trim(),
        description:   document.getElementById('new-description').value.trim(),
        priority:      document.getElementById('new-priority').value,
        assignee:      document.getElementById('new-assignee').value.trim() || 'unassigned',
        token_budget:  parseInt(document.getElementById('new-budget').value,   10) || 2000,
        time_estimate: parseInt(document.getElementById('new-estimate').value, 10) || 60,
        creator:       getSettings().ait_user || 'unknown',
        created_by:    'human-manual'
      });
      applyFilters();
      closeModal();
    });

    // ── AI keyword detection ───────────────────────────────────
    function firstWords(text, n) {
      return text.trim().split(/\s+/).slice(0, n).join(' ');
    }

    function structureIssue(text) {
      const t = text.toLowerCase();
      if (/bug|break|fix|error/.test(t)) {
        return {
          title:        'Fix: ' + firstWords(text, 6),
          description:  'Bug report: ' + text +
                        '\n\nExpected behavior: System should handle this correctly.' +
                        '\nActual behavior: ' + text +
                        '\nImpact: Affects user workflow.',
          priority:     'P1',
          token_budget: 1500
        };
      }
      if (/refactor|clean|improve/.test(t)) {
        return {
          title:        'Refactor: ' + firstWords(text, 6),
          description:  'Technical debt: ' + text +
                        '\n\nGoal: Improve code quality and maintainability.' +
                        '\nScope: Isolated to affected module.',
          priority:     'P2',
          token_budget: 2000
        };
      }
      if (/feature|add|new|build/.test(t)) {
        return {
          title:        'Feature: ' + firstWords(text, 6),
          description:  'Feature request: ' + text +
                        '\n\nAcceptance criteria:\n- [ ] Core functionality works' +
                        '\n- [ ] Edge cases handled\n- [ ] Tests written',
          priority:     'P1',
          token_budget: 3000
        };
      }
      return {
        title:        firstWords(text, 8),
        description:  text,
        priority:     'P2',
        token_budget: 1000
      };
    }

    function logLLM(input, result) {
      console.log('[LLM] POST /api/llm/structure-issue');
      console.log('[LLM] Input: "' + input.slice(0, 50) + (input.length > 50 ? '...' : '') + '"');
      console.log('[LLM] Response:', {
        title: result.title, description: result.description,
        priority: result.priority, token_budget: result.token_budget
      });
      console.log('[LLM] Tokens used for creation: 312');
    }

    document.getElementById('ai-input-back').addEventListener('click', () => showScreen('choice'));

    document.getElementById('ai-analyze-btn').addEventListener('click', () => {
      const input = document.getElementById('ai-desc-input').value.trim();
      if (!input) { document.getElementById('ai-desc-input').focus(); return; }
      showScreen('ai-loading');
      setTimeout(() => {
        const result = structureIssue(input);
        logLLM(input, result);
        document.getElementById('ai-title').value       = result.title;
        document.getElementById('ai-description').value = result.description;
        document.getElementById('ai-priority').value    = result.priority;
        document.getElementById('ai-budget').value      = result.token_budget;
        showScreen('ai-preview');
      }, 500);
    });

    document.getElementById('ai-back-btn').addEventListener('click', () => showScreen('ai-input'));

    document.getElementById('ai-confirm-btn').addEventListener('click', () => {
      const issue = createIssue({
        title:         document.getElementById('ai-title').value.trim(),
        description:   document.getElementById('ai-description').value.trim(),
        priority:      document.getElementById('ai-priority').value,
        assignee:      'unassigned',
        token_budget:  parseInt(document.getElementById('ai-budget').value, 10) || 1000,
        time_estimate: 60,
        creator:       getSettings().ait_user || 'unknown',
        created_by:    'llm-assist'
      });
      applyFilters();
      closeModal();
      requestAnimationFrame(() => {
        const row = document.querySelector('[data-id="' + issue.id + '"]');
        if (row) {
          row.classList.add('sim-flash');
          setTimeout(() => row.classList.remove('sim-flash'), 1600);
        }
      });
    });

    // ── Filters wiring ─────────────────────────────────────────
    ['filter-status','filter-priority'].forEach(id => {
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('filter-assignee').addEventListener('input', applyFilters);
    document.getElementById('filter-search').addEventListener('input', applyFilters);

    // ── Agent sim re-render hook ───────────────────────────────
    document.addEventListener('ait:data-changed', applyFilters);
  </script>
  <script type="module" src="js/agent-sim.js"></script>
  <script type="module" src="js/demo.js"></script>

</body>
</html>
